<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>消息中心 · EtsyOps</title>
<script src="config.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 64px;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f5f5f4; color: #1c1c1a; font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; }
  header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 4px; }
  .sub { font-size: 13px; color: #6b6a65; }
  .btns { display: flex; gap: 8px; }
  button {
    font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px;
    border: 1px solid #d6d4cd; background: #fff; color: #1c1c1a; cursor: pointer;
  }
  button:hover { border-color: #b4b1a8; }
  button.primary { background: #185FA5; border-color: #185FA5; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 12px; margin-bottom: 20px; }
  .stat { background: #fff; border: 1px solid #e7e5df; border-radius: 12px; padding: 14px 16px; }
  .stat .k { font-size: 13px; color: #6b6a65; margin-bottom: 4px; }
  .stat .v { font-size: 24px; font-weight: 500; }
  .stat .v.danger { color: #A32D2D; }
  .stat .v.muted { color: #8a8880; }
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .filters button.on { border-color: #185FA5; color: #185FA5; background: #E6F1FB; }
  .card { background: #fff; border: 1px solid #e7e5df; border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .tag { font-size: 12px; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
  .t-message { background: #E6F1FB; color: #185FA5; }
  .t-order { background: #EAF3DE; color: #3B6D11; }
  .t-case { background: #FCEBEB; color: #A32D2D; }
  .t-review { background: #FAEEDA; color: #854F0B; }
  .t-other, .t-policy { background: #F1EFE8; color: #5F5E5A; }
  .who { font-weight: 500; }
  .muted { color: #6b6a65; font-size: 13px; }
  .age { margin-left: auto; font-size: 12px; color: #6b6a65; white-space: nowrap; }
  .age.warn { color: #854F0B; }
  .age.danger { color: #A32D2D; }
  .summary { margin: 8px 0 0; color: #52504b; font-size: 13px; }
  .actions { display: flex; gap: 8px; margin-top: 12px; }
  .empty { text-align: center; color: #8a8880; padding: 40px 0; font-size: 13px; }
  .section-title { font-size: 13px; color: #6b6a65; margin: 24px 0 10px; display: flex; align-items: center; gap: 8px; }
  .section-title .count { background: #e7e5df; border-radius: 5px; padding: 1px 7px; }
  .ship { display: flex; justify-content: space-between; gap: 12px; align-items: baseline; }
  .ship .lines { font-size: 13px; color: #6b6a65; }
  .banner { background: #FCEBEB; border: 1px solid #F7C1C1; color: #791F1F; border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 14px; }
  .low { margin-top: 24px; }
  .low summary { cursor: pointer; color: #6b6a65; font-size: 13px; }
  .hint { font-size: 12px; color: #8a8880; margin: 0 0 12px; }
  @media (max-width: 640px) {
    .stats { grid-template-columns: repeat(2, minmax(0,1fr)); }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>消息中心</h1>
      <div class="sub" id="sub">正在加载…</div>
    </div>
    <div class="btns">
      <button id="refresh">刷新</button>
    </div>
  </header>

  <div id="banner"></div>

  <section class="stats">
    <div class="stat"><div class="k">未处理咨询</div><div class="v" id="s-msg">–</div></div>
    <div class="stat"><div class="k">超过 24 小时</div><div class="v" id="s-over">–</div></div>
    <div class="stat"><div class="k">待发货订单</div><div class="v" id="s-ship">–</div></div>
    <div class="stat"><div class="k">今日新订单</div><div class="v" id="s-today">–</div></div>
  </section>

  <p class="hint">这里只做提醒。回复买家、发货等操作请到 Etsy 后台完成，工作台不代办。</p>

  <nav class="filters" id="filters">
    <button data-f="todo" class="on">待处理</button>
    <button data-f="message">咨询</button>
    <button data-f="order">订单</button>
    <button data-f="case">纠纷</button>
    <button data-f="all">全部</button>
  </nav>

  <main id="list"><div class="empty">正在加载…</div></main>

  <div class="low">
    <details id="low-box">
      <summary><span id="low-title">低优先</span></summary>
      <div id="low-list"></div>
    </details>
  </div>
</div>

<script>
(function () {
  var API = (window.ETSYOPS_API_BASE || '').replace(/\/$/, '');
  var KEY = window.ETSYOPS_API_KEY || '';

  var S = { events: [], orders: [], orderErr: '', filter: 'todo', loading: false, syncAt: 0 };

  function api(path, opts) {
    opts = opts || {};
    var headers = Object.assign({ 'content-type': 'application/json' }, opts.headers || {});
    if (KEY) headers['x-api-key'] = KEY;
    return fetch(API + path, Object.assign({}, opts, { headers: headers }))
      .then(function (r) { return r.json(); });
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c];
    });
  }

  function typeClass(t) {
    return ['message', 'order', 'case', 'review'].indexOf(t) >= 0 ? 't-' + t : 't-other';
  }

  function ageText(h) {
    if (h < 1) return '刚刚';
    if (h < 24) return '已等 ' + h + ' 小时';
    return '已等 ' + Math.floor(h / 24) + ' 天';
  }

  function ageClass(h) {
    if (h >= 24) return 'danger';
    if (h >= 8) return 'warn';
    return '';
  }

  function isTodo(e) { return e.status === 'pending' || e.status === 'opened'; }

  function cardHtml(e) {
    var title = e.buyer || e.subject || '(无主题)';
    var sub = e.buyer && e.shop ? ('· ' + e.shop) : '';
    var summary = e.buyer ? e.subject : '';
    return '<article class="card">'
      + '<div class="row">'
      + '<span class="tag ' + typeClass(e.type) + '">' + esc(e.label) + '</span>'
      + '<span class="who">' + esc(title) + '</span>'
      + (sub ? '<span class="muted">' + esc(sub) + '</span>' : '')
      + '<span class="age ' + ageClass(e.ageHours) + '">' + ageText(e.ageHours) + '</span>'
      + '</div>'
      + (summary ? '<p class="summary">' + esc(summary) + '</p>' : '')
      + '<div class="actions">'
      + '<button data-done="' + esc(e.id) + '">标记已处理</button>'
      + '</div>'
      + '</article>';
  }

  function render() {
    var ev = S.events.slice();

    var todo = ev.filter(isTodo);
    var msgs = todo.filter(function (e) { return e.type === 'message'; });
    var over = todo.filter(function (e) { return e.ageHours >= 24; });
    var today = ev.filter(function (e) { return e.type === 'order' && e.ageHours < 24; });

    document.getElementById('s-msg').textContent = msgs.length;
    var overEl = document.getElementById('s-over');
    overEl.textContent = over.length;
    overEl.className = 'v' + (over.length ? ' danger' : '');

    var shipEl = document.getElementById('s-ship');
    if (S.orderErr) {
      shipEl.textContent = '—';
      shipEl.className = 'v muted';
      document.getElementById('banner').innerHTML =
        '<div class="banner">待发货数取不到：' + esc(S.orderErr) + '</div>';
    } else {
      shipEl.textContent = S.orders.length;
      shipEl.className = 'v' + (S.orders.length ? '' : ' muted');
      document.getElementById('banner').innerHTML = '';
    }
    document.getElementById('s-today').textContent = today.length;

    document.getElementById('sub').textContent = S.syncAt
      ? ('最近同步 ' + new Date(S.syncAt).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })
         + ' · 共 ' + S.events.length + ' 封')
      : '正在加载…';

    var f = S.filter;
    var list = f === 'todo' ? todo : (f === 'all' ? ev : ev.filter(function (e) { return e.type === f; }));
    list.sort(function (a, b) { return b.ageHours - a.ageHours; });

    var listEl = document.getElementById('list');
    if (!list.length) {
      listEl.innerHTML = '<div class="empty">这里现在是空的 —— 没有需要处理的事。</div>';
    } else {
      var shipHtml = '';
      if (S.orders.length && (f === 'todo' || f === 'order' || f === 'all')) {
        shipHtml = '<div class="section-title">待发货（来自 Etsy 订单接口）<span class="count">'
          + S.orders.length + '</span></div>';
        S.orders.forEach(function (o) {
          var lines = (o.lines || []).map(function (l) { return esc(l.title) + ' ×' + l.qty; }).join('；');
          shipHtml += '<article class="card"><div class="ship">'
            + '<div><span class="tag t-order">待发货</span> '
            + '<span class="who">' + esc(o.buyer || ('订单 #' + o.id)) + '</span>'
            + '<div class="lines">' + (lines || '—') + '</div></div>'
            + '<div class="muted">' + esc(o.currency) + ' ' + Number(o.total).toFixed(2) + '</div>'
            + '</div></article>';
        });
      }
      listEl.innerHTML = shipHtml + list.map(cardHtml).join('');
    }

    // 低优先：营销 / 已忽略
    var low = ev.filter(function (e) {
      return e.type === 'other' || e.type === 'policy' || e.status === 'ignored' || e.status === 'done';
    });
    document.getElementById('low-title').textContent = '低优先 / 已处理 ' + low.length + ' 封';
    document.getElementById('low-list').innerHTML = low.length
      ? low.slice(0, 50).map(cardHtml).join('')
      : '<div class="empty">没有</div>';
  }

  function load() {
    if (S.loading) return;
    S.loading = true;
    document.getElementById('refresh').disabled = true;

    Promise.all([
      api('/api/mail/events?limit=200').catch(function (e) { return { ok: false, note: String(e) }; }),
      api('/api/orders/pending').catch(function (e) { return { ok: false, note: String(e) }; })
    ]).then(function (res) {
      var ev = res[0], od = res[1];
      S.events = (ev && ev.items) || [];
      if (od && od.ok) {
        S.orders = od.items || [];
        S.orderErr = '';
      } else {
        S.orders = [];
        S.orderErr = (od && (od.note || od.error)) || '接口没有返回';
      }
      S.syncAt = Date.now();
      render();
    }).finally(function () {
      S.loading = false;
      document.getElementById('refresh').disabled = false;
    });
  }

  function mark(id, status) {
    api('/api/mail/mark', { method: 'POST', body: JSON.stringify({ id: id, status: status }) })
      .then(function (r) {
        if (!r || !r.ok) return;
        S.events.forEach(function (e) { if (e.id === id) e.status = status; });
        render();
      });
  }

  document.getElementById('refresh').addEventListener('click', load);

  document.getElementById('filters').addEventListener('click', function (ev) {
    var b = ev.target.closest('button[data-f]');
    if (!b) return;
    S.filter = b.getAttribute('data-f');
    Array.prototype.forEach.call(this.querySelectorAll('button'), function (x) {
      x.classList.toggle('on', x === b);
    });
    render();
  });

  document.addEventListener('click', function (ev) {
    var doneBtn = ev.target.closest('button[data-done]');
    if (doneBtn) {
      mark(doneBtn.getAttribute('data-done'), 'done');
    }
  });

  load();
})();
</script>
</body>
</html>
