<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8">
<title>AI生稿 最小验证页</title>
<script src="https://etsyops-workbench.pages.dev/config.js"></script>
</head><body style="font-family:system-ui;padding:24px;max-width:900px">
<h2>AI 生稿 · 最小验证页</h2>
<p style="color:#666">绕开排版/预览等所有复杂逻辑，只测「提交 → 轮询 → 读结果」三件事。</p>
<label>素材 <textarea id="ms" style="width:100%;height:90px">杭州Etsy实操营结束，学员反馈课程实用，想了解选品上架。</textarea></label>
<label>要求 <input id="pr" value="写一篇600字公众号文章" style="width:100%;padding:6px"></label>
<button id="go" style="padding:10px 20px;font-size:15px">开始</button>
<div id="log" style="margin-top:14px;font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;background:#111;color:#0f0;padding:12px;border-radius:6px;min-height:220px"></div>
<script>
const API = window.getApiBase ? window.getApiBase() : '';
const logEl=document.getElementById('log');
let n=0;
function log(s){ logEl.textContent += (++n)+'. '+s+'\n'; logEl.scrollTop=1e9; }
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function j(url,opts){
  opts=opts||{};
  const c=new AbortController(); const t=setTimeout(()=>c.abort(),opts.timeout||30000);
  const r=await fetch(url,Object.assign({},opts,{signal:c.signal}));
  const txt=await r.text();
  clearTimeout(t);
  if((r.headers.get('content-type')||'').indexOf('json')<0)
    throw new Error('非JSON ct='+r.headers.get('content-type')+' 开头:'+txt.slice(0,80));
  const d=JSON.parse(txt);
  if(!r.ok) throw new Error(d.note||('HTTP '+r.status));
  return d;
}
document.getElementById('go').onclick=async function(){
  n=0; logEl.textContent='';
  this.disabled=true;
  try{
    log('API_BASE = '+API);
    log('提交任务…');
    const t0=Date.now();
    const sub=await j(API+'/api/ai/generate',{method:'POST',timeout:30000,
      headers:{'Content-Type':'application/json','Accept-Encoding':'identity'},
      body:JSON.stringify({manuscript:document.getElementById('ms').value,
                          prompt:document.getElementById('pr').value,async:true})});
    log('提交成功 jobId='+sub.jobId+'  用时'+(Date.now()-t0)+'ms');
    for(let i=0;i<150;i++){
      await sleep(2000);
      const t1=Date.now();
      const st=await j(API+'/api/ai/job?id='+encodeURIComponent(sub.jobId),{timeout:20000});
      log('第'+(i+1)+'次 status='+st.status+' waited='+(st.waited||'-')+' 本次'+(Date.now()-t1)+'ms');
      if(st.status==='done'){
        log('★ 出稿成功，长度 '+st.content.length+' 字');
        const pre=document.createElement('pre');
        pre.style.cssText='background:#fff;color:#000;padding:10px;max-height:300px;overflow:auto;font-size:12px';
        pre.textContent=st.content;
        document.getElementById('log').after(pre);
        break;
      }
      if(st.status==='error'){ log('✗ 失败：'+st.note); break; }
    }
  }catch(e){ log('✗ 异常：'+e.message); }
  finally{ this.disabled=false; }
};
</script></body></html>
